[package]
name = "sample-plugin"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
vapoursynth4-rs = { version = "0.5.1", path = "../vapoursynth4-rs", features = [
  "link-vs",       # for the GPU device probe in tests
  "link-vsscript", # for tests
  "vs-vulkan",     # for the GPU filter example
] }


[dev-dependencies]
testresult = "0.4.1"
